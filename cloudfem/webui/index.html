<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CloudFEM v0.6 — Web UI: steady heat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
  #cv { border: 1px solid #888; cursor: crosshair; display: block; }
  .row { margin: 10px 0; }
  label { margin-right: 14px; }
  input[type=number] { width: 80px; }
  button { margin-right: 8px; padding: 6px 14px; }
  #status { min-height: 1.4em; color: #333; font-size: 14px; }
  #legend { margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<h2>CloudFEM v0.6 — draw, mesh, solve (steady heat)</h2>
<p>Click on the canvas to place polygon vertices. <b>Mesh</b> builds the
triangular mesh; <b>Solve</b> runs steady heat with T<sub>hot</sub> on the
left edge, T<sub>cold</sub> on the right edge (rest insulated) and paints the
temperature field.</p>
<canvas id="cv" width="600" height="450"></canvas>
<div class="row" id="legend"></div>
<div class="row">
  <label>T<sub>hot</sub> <input type="number" id="thot" value="100" step="1"></label>
  <label>T<sub>cold</sub> <input type="number" id="tcold" value="0" step="1"></label>
  <label>mesh size h <input type="number" id="h" value="20" step="1" min="5"></label>
</div>
<div class="row">
  <button id="bmesh">Mesh</button>
  <button id="bsolve">Solve</button>
  <button id="bclear">Clear</button>
</div>
<div id="status"></div>
<script>
const W = 600, H = 450;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const status = document.getElementById('status');
const legend = document.getElementById('legend');
let verts = [];          // model coords (x right, y up)
let lastMesh = null;

const X = (x) => x;              // model -> canvas
const Y = (y) => H - y;          // model y-up -> canvas y-down

function setStatus(s) { status.textContent = s; }

// cold(blue) -> hot(red) colormap, t in [0,1]
function cmap(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.round(255 * t);
  const b = Math.round(255 * (1 - t));
  return `rgb(${r},40,${b})`;
}

function drawVertices() {
  ctx.fillStyle = '#111';
  for (const [x, y] of verts) {
    ctx.beginPath(); ctx.arc(X(x), Y(y), 4, 0, 2 * Math.PI); ctx.fill();
  }
  if (verts.length > 1) {
    ctx.strokeStyle = '#111'; ctx.beginPath();
    verts.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)));
    ctx.closePath(); ctx.stroke();
  }
}

function drawMesh(mesh) {
  const [nodes, elems] = [mesh.nodes, mesh.elements];
  ctx.strokeStyle = '#9ab'; ctx.lineWidth = 0.7; ctx.beginPath();
  for (const e of elems) {
    for (let k = 0; k < 3; k++) {
      const a = nodes[e[k]], b = nodes[e[(k + 1) % 3]];
      ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(b[0]), Y(b[1]));
    }
  }
  ctx.stroke();
}

function drawTemps(mesh) {
  const [nodes, elems, temps] = [mesh.nodes, mesh.elements, mesh.temps];
  const tmin = mesh.t_min, tmax = mesh.t_max;
  const span = (tmax - tmin) || 1;
  for (const e of elems) {
    const t = (temps[e[0]] + temps[e[1]] + temps[e[2]]) / 3;
    ctx.fillStyle = cmap((t - tmin) / span);
    ctx.beginPath();
    ctx.moveTo(X(nodes[e[0]][0]), Y(nodes[e[0]][1]));
    ctx.lineTo(X(nodes[e[1]][0]), Y(nodes[e[1]][1]));
    ctx.lineTo(X(nodes[e[2]][0]), Y(nodes[e[2]][1]));
    ctx.closePath(); ctx.fill();
  }
  // colorbar
  let bar = '<span style="display:inline-block;width:220px;height:14px;background:linear-gradient(to right,' +
    [0, .25, .5, .75, 1].map(cmap).join(',') + ');vertical-align:middle"></span> ';
  legend.innerHTML = bar + ` ${tmin.toFixed(1)} °C … ${tmax.toFixed(1)} °C`;
}

function redraw() {
  ctx.clearRect(0, 0, W, H);
  if (lastMesh && lastMesh.temps) drawTemps(lastMesh);
  else if (lastMesh) drawMesh(lastMesh);
  drawVertices();
}

cv.addEventListener('click', (ev) => {
  const r = cv.getBoundingClientRect();
  const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  verts.push([cx, H - cy]);
  lastMesh = null; legend.innerHTML = '';
  redraw();
});

function payload() {
  return {
    vertices: verts,
    h: parseFloat(document.getElementById('h').value),
    t_hot: parseFloat(document.getElementById('thot').value),
    t_cold: parseFloat(document.getElementById('tcold').value),
  };
}

async function post(path) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload()),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

document.getElementById('bmesh').onclick = async () => {
  if (verts.length < 3) { setStatus('need at least 3 vertices'); return; }
  setStatus('meshing…');
  try {
    const m = await post('/api/mesh');
    lastMesh = m;
    setStatus(`mesh: ${m.n_nodes} nodes, ${m.n_elements} triangles, ` +
              `min quality ${m.min_quality.toFixed(2)}, mean ${m.mean_quality.toFixed(2)}`);
    redraw();
  } catch (e) { setStatus('mesh failed: ' + e.message); }
};

document.getElementById('bsolve').onclick = async () => {
  if (verts.length < 3) { setStatus('need at least 3 vertices'); return; }
  setStatus('solving…');
  try {
    const m = await post('/api/solve');
    lastMesh = m;
    setStatus(`solved: ${m.n_nodes} nodes, T range [${m.t_min.toFixed(1)}, ${m.t_max.toFixed(1)}]`);
    redraw();
  } catch (e) { setStatus('solve failed: ' + e.message); }
};

document.getElementById('bclear').onclick = () => {
  verts = []; lastMesh = null; legend.innerHTML = ''; setStatus(''); redraw();
};

redraw();
</script>
</body>
</html>
